spring:
  datasource:
    url: jdbc:postgresql://${BOOKMARKIFY_POSTGRES_HOST}:5432/bookmarkify?stringtype=unspecified
    username: ${BOOKMARKIFY_POSTGRES_USERNAME}
    password: ${BOOKMARKIFY_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      database: 1
      host: ${BOOKMARKIFY_REDIS_HOST}
      port: ${BOOKMARKIFY_REDIS_PORT}
      password: ${BOOKMARKIFY_REDIS_PASSWORD}

logging:
  level:
    top.tcyeee.bookmarkify.server.impl.BookmarkServiceImpl: DEBUG

bookmarkify:
  scrapper:
    # 本地开发连远程已部署的 scrapper（容器 3000 映射到宿主机 3001，对外开放）
    base-url: http://123.206.216.124:3001
  config:
    # 这里必须是前端项目中/public/upload目录，否则图片无法正常读取
    img-path: ${BOOKMARKIFY_FILE_UPLOAD_DIR}
    img-prefix: ${BOOKMARKIFY_FILE_UPLOAD_PREFIX}