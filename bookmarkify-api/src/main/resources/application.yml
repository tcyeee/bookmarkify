server:
  port: 7001

logging:
  level:
    root: INFO

mybatis-plus:
  global-config:
    banner: false

knife4j:
  enable: false
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: false
    enable-home-custom: true
    enable-swagger-models: false
    home-custom-path: classpath:README.md

sa-token:
  token-name: satoken
  timeout: 2592000
  is-log: true
  is-print: false

spring:
  servlet:
    multipart:
      max-file-size: 10MB       # 单个文件最大10MB
      max-request-size: 50MB    # 单次请求总大小50MB
      file-size-threshold: 2MB  # 可选：内存缓存阈值
      enabled: true             # 可选：开启上传支持

bookmarkify:
  wechat:
    # 微信企业邮箱-企业ID
    corpid: ${BOOKMARKIFY_WECHAT_WORK_CORPID}
    # 微信企业邮箱-自建应用 SECRET-CODE
    corpsecret: ${BOOKMARKIFY_WECHAT_WORK_CORPSECRET}
  aliyun:
    oss:
      endpoint: ${BOOKMARKIFY_ALIYUN_OSS_ENDPOINT}
      access-key-id: ${BOOKMARKIFY_ALIYUN_OSS_ACCESS_KEY_ID}
      access-key-secret: ${BOOKMARKIFY_ALIYUN_OSS_ACCESS_KEY_SECRET}
      bucket-name: ${BOOKMARKIFY_ALIYUN_OSS_BUCKET_NAME}
      domain-name: ${BOOKMARKIFY_ALIYUN_OSS_DOMAIN} # 自定义域名 https://i.tcyeee.top
  scrapper:
    base-url: ${BOOKMARKIFY_SCRAPPER_BASE_URL:http://bookmarkify-scraper:3000}  # 自部署 scrapper 服务地址（接替 iframely）
  goatcounter:
    # 自托管 GoatCounter 站点地址（dev/prod 同走公网域名，prod 经 nginx 回环命中 site3）
    base-url: ${BOOKMARKIFY_GOATCOUNTER_BASE_URL:https://bookmarkify.stats.viii.me}
    # 只读统计 Token（perm=64 stats-read，sites:[-1]）
    token: ${BOOKMARKIFY_GOATCOUNTER_TOKEN:vvw0ggxoxwmppfxmzvomroeddflxq5ynlzi5r2hd3rvtn024}
  deepseek:
    api-key: ${BOOKMARKIFY_DEEPSEEK_API_KEY}
  admin:
    login:
      account: tcyeee@outlook.com
      password: admin
  config:
    use-third-party-parser: true  # 书签解析模式: true=远程scrapper, false=本地Jsoup解析
    google-client-id: ${BOOKMARKIFY_GOOGLE_CLIENT_ID:}  # Google 登录 OAuth Client ID（用于校验 ID Token 的 aud），未配置则关闭谷歌登录
    google-proxy-host: ${BOOKMARKIFY_GOOGLE_PROXY_HOST:}  # 校验 Google ID Token 走的 HTTP 代理主机（国内服务器经 VPN 代理访问 Google），空则直连
    google-proxy-port: ${BOOKMARKIFY_GOOGLE_PROXY_PORT:0}  # 代理端口
    uid-cookie-name: 'deviceUid'    # 匿名用户 cookie 名称
    uid-cookie-path: "/"            # 匿名用户 cookie 路径
    uid-cookie-max-age: 315360000   # 10 年（秒）
    max-custom-background-count: 5  # 自定义背景（图片/渐变）最大数量
    default-bookmarkify:
      - 'https://xiaohongshu.com'
      - 'https://www.guokr.com'
      - 'https://www.163.com'
      - 'https://www.gamersky.com'
      - 'https://www.douban.com'
      - 'https://sspai.com'
      - 'https://bilibili.com'
    default-background-image:
      - '019b86fd-74af-7058-829f-3f580c54c1e8.png'
      - '019b86fd-8fd8-73cf-a70b-663ec100a4dd.png'
      - '019b86fd-c179-752d-a060-7f8647efbf9c.png'
    default-background-gradient:
      - gradient:
          - "#a69f9f"
          - "#c1baba"
          - "#8f9ea6"
        direction: 103
        name: 默认渐变1
      - gradient:
          - "#667eea"
          - "#764ba2"
        direction: 103
        name: 默认渐变2
      - gradient:
          - "#f093fb"
          - "#f5576c"
        direction: 103
        name: 默认渐变3
      - gradient:
          - "#4facfe"
          - "#00f2fe"
        direction: 103
        name: 默认渐变4