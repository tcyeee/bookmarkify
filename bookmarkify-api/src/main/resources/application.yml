server:
  port: 7001

logging:
  level:
    root: INFO
    # 异常已被 GlobalExceptionHandler 接管并打出更有信息量的日志，
    # 屏蔽框架级 "Resolved [...异常...]" 的重复 WARN（如未登录、参数校验等）
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR

mybatis-plus:
  global-config:
    banner: false

knife4j:
  enable: false
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: false
    enable-home-custom: true
    enable-swagger-models: false
    home-custom-path: classpath:README.md

sa-token:
  token-name: satoken
  timeout: 2592000
  is-log: true
  is-print: false

spring:
  servlet:
    multipart:
      max-file-size: 10MB       # 单个文件最大10MB
      max-request-size: 50MB    # 单次请求总大小50MB
      file-size-threshold: 2MB  # 可选：内存缓存阈值
      enabled: true             # 可选：开启上传支持
  jackson:
    deserialization:
      # scrapper 是解耦的通用服务，会持续新增 extractor 等枚举取值。遇到不认识的取值时
      # 回落到该枚举标了 @JsonEnumDefaultValue 的 UNKNOWN 常量，而不是整个响应解析失败。
      read-unknown-enum-values-using-default-value: true

bookmarkify:
  # 本实例是否承担后台定时任务（活性巡检、解析对账、日志清理、OSS 对账）。
  #
  # 默认 true —— 线上那台必须跑。dev profile 显式置 false，理由见 application-dev.yml。
  # 关掉它的实例同时也不参与 SingleInstanceGuard 的所有权竞争：不跑调度的实例在
  # "谁来写生产数据"这件事上是无害的，让它去抢租约只会把线上那台的护栏刷成噪音。
  scheduling:
    enabled: true
  wechat:
    # 微信企业邮箱-企业ID
    corpid: ${BOOKMARKIFY_WECHAT_WORK_CORPID}
    # 微信企业邮箱-自建应用 SECRET-CODE
    corpsecret: ${BOOKMARKIFY_WECHAT_WORK_CORPSECRET}
  aliyun:
    oss:
      endpoint: ${BOOKMARKIFY_ALIYUN_OSS_ENDPOINT}
      access-key-id: ${BOOKMARKIFY_ALIYUN_OSS_ACCESS_KEY_ID}
      access-key-secret: ${BOOKMARKIFY_ALIYUN_OSS_ACCESS_KEY_SECRET}
      bucket-name: ${BOOKMARKIFY_ALIYUN_OSS_BUCKET_NAME}
      domain-name: ${BOOKMARKIFY_ALIYUN_OSS_DOMAIN} # 自定义域名 https://i.tcyeee.top
      # 自建缓存代理的域名，例如 https://bookmarkify.cc。**留空 = 关闭**，一切按签名直连 OSS。
      # 打开后，不可变对象（内容寻址 / 随机 UUID）改由 nginx 代理并下发不带签名的永久地址，
      # 浏览器可缓存一年，OSS 侧每个 (key,尺寸) 只被读一次、只被处理一次。
      # ⚠️ 打开之前 nginx 那份 /oss/ 配置必须先装好并 reload（见 deploy/nginx/oss-cache-proxy.conf）,
      # 顺序不能反 —— 先开开关会让全站图片 404。回滚就是清空这一项后重启。
      proxy-domain: ${BOOKMARKIFY_ALIYUN_OSS_PROXY_DOMAIN:}
      # nginx 与本服务之间的共享密钥，保护 /internal/asset/** 这个回源入口。
      # **留空 = 该端点整体关闭**（一律 404）—— 失败方向刻意选成"不通"而非"放行"：
      # bookmarkify.cc 的 /api/ 规则会把 /api/** 整体转发到本服务，也就是说这个路径事实上
      # 从公网够得到，漏配即放行等于把一个按次计费的接口裸露出去。
      proxy-token: ${BOOKMARKIFY_ALIYUN_OSS_PROXY_TOKEN:}
  oss:
    # 对账时是否真的删除孤儿对象。默认关闭：对账本身只要跑起来就有价值（补上"桶里到底有什么"
    # 这个盲区），而删除不可逆——引用方收集逻辑漏一处，被删的就是用户头像。
    # 上线顺序：先只报不删跑几轮，人工核对孤儿清单确实是垃圾，再打开。
    reclaim-orphans: ${BOOKMARKIFY_OSS_RECLAIM_ORPHANS:false}
    # 孤儿观察期(天)。挡的是"scrapper 已 PUT、API 还没落行"那个时序窗口——
    # 没有它，一次撞上对账的正常抓取会被当场清掉刚传上去的图
    orphan-grace-days: ${BOOKMARKIFY_OSS_ORPHAN_GRACE_DAYS:30}
    reconcile-max-keys: 200000  # 单前缀扫描上限，防止桶失控时把整个列表读进堆
  scrapper:
    base-url: ${BOOKMARKIFY_SCRAPPER_BASE_URL:http://bookmarkify-scraper:3000}  # 自部署 scrapper 服务地址（接替 iframely）
    auth-token: ${BOOKMARKIFY_SCRAPPER_AUTH_TOKEN:}  # 对应 scrapper 的 SCRAPER_AUTH_TOKEN；留空则不发送鉴权 header
    # 必须与 scrapper 的 OSS_KEY_PREFIX 一致。只被对账任务用来决定扫桶里的哪一段前缀；
    # 配错会让那段对象漏扫（不会误判成孤儿，故不会误删），治理失效而已
    key-prefix: ${BOOKMARKIFY_SCRAPPER_KEY_PREFIX:scrapper}
    # 抓到的图片一律落我方 OSS（assets.download=UPLOAD）。关掉只会退化成 PROBE：图照样下载
    # 但算完 hash 就丢，库里只剩源站直连地址，首页图标的可用性等于外包给了第三方站点。
    # 仅排障时临时关闭，不要在任何环境常态关闭。
    upload-assets: ${BOOKMARKIFY_SCRAPPER_UPLOAD_ASSETS:true}
    # 重抓后回收"最后一个引用者也没了"的 OSS 对象。删对象不可逆，留此开关以便随时止血
    reclaim-orphan-assets: ${BOOKMARKIFY_SCRAPPER_RECLAIM_ORPHAN_ASSETS:true}
    asset-max-bytes: 8388608  # 单张图片上限 8MB（契约默认 2MB 是给"只探测"场景定的，会挡掉大尺寸 og:image）
    asset-max-count: 40       # 单页最多处理 40 张图（图标齐全的站点很容易超过契约默认的 20）
    # 主解析链路是否等截图。保持关闭：截图强制走无头浏览器，而对端的无头并发是有上限的
    # （scrapper 的 HEADLESS_CONCURRENCY，默认 2），放进主链路等于让每条新增书签排队等浏览器。
    # 截图走下面的异步补抓。
    screenshot: ${BOOKMARKIFY_SCRAPPER_SCREENSHOT:false}
    # 解析成功后异步补一张页面截图，作为详情面板封面（BookmarkScreenshotEvent，单线程池）。
    # 关掉即完全不产生截图负载。
    screenshot-async: ${BOOKMARKIFY_SCRAPPER_SCREENSHOT_ASYNC:true}
    # 截图格式与质量。WEBP 同等观感下体积约为 PNG 的三分之一，封面是纯展示用途，有损可接受
    screenshot-format: ${BOOKMARKIFY_SCRAPPER_SCREENSHOT_FORMAT:WEBP}
    screenshot-quality: ${BOOKMARKIFY_SCRAPPER_SCREENSHOT_QUALITY:80}
  goatcounter:
    # 自托管 GoatCounter 站点地址（dev/prod 同走公网域名，prod 经 nginx 回环命中 site3）
    base-url: ${BOOKMARKIFY_GOATCOUNTER_BASE_URL:https://bookmarkify.stats.viii.me}
    # 只读统计 Token（perm=64 stats-read，sites:[-1]）
    token: ${BOOKMARKIFY_GOATCOUNTER_TOKEN:vvw0ggxoxwmppfxmzvomroeddflxq5ynlzi5r2hd3rvtn024}
  deepseek:
    api-key: ${BOOKMARKIFY_DEEPSEEK_API_KEY}
  admin:
    login:
      account: tcyeee@outlook.com
      password: admin
  config:
    use-third-party-parser: true  # 书签解析模式: true=远程scrapper, false=本地Jsoup解析
    google-client-id: ${BOOKMARKIFY_GOOGLE_CLIENT_ID:}  # Google 登录 OAuth Client ID（用于校验 ID Token 的 aud），未配置则关闭谷歌登录
    google-proxy-host: ${BOOKMARKIFY_GOOGLE_PROXY_HOST:}  # 校验 Google ID Token 走的 HTTP 代理主机（国内服务器经 VPN 代理访问 Google），空则直连
    google-proxy-port: ${BOOKMARKIFY_GOOGLE_PROXY_PORT:0}  # 代理端口
    github-client-id: ${BOOKMARKIFY_GITHUB_CLIENT_ID:}  # GitHub 登录 OAuth App Client ID，未配置则关闭 GitHub 登录
    github-client-secret: ${BOOKMARKIFY_GITHUB_CLIENT_SECRET:}  # GitHub 登录 OAuth App Client Secret
    uid-cookie-name: 'deviceUid'    # 匿名用户 cookie 名称
    uid-cookie-path: "/"            # 匿名用户 cookie 路径
    uid-cookie-max-age: 315360000   # 10 年（秒）
    max-custom-background-count: 5  # 自定义背景（图片/渐变）最大数量
    default-bookmarkify:
      - 'https://xiaohongshu.com'
      - 'https://www.guokr.com'
      - 'https://www.163.com'
      - 'https://www.gamersky.com'
      - 'https://www.douban.com'
      - 'https://sspai.com'
      - 'https://bilibili.com'
    default-background-image:
      - '019b86fd-74af-7058-829f-3f580c54c1e8.png'
      - '019b86fd-8fd8-73cf-a70b-663ec100a4dd.png'
      - '019b86fd-c179-752d-a060-7f8647efbf9c.png'
    default-background-gradient:
      - gradient:
          - "#a69f9f"
          - "#c1baba"
          - "#8f9ea6"
        direction: 103
        name: 默认渐变1
      - gradient:
          - "#667eea"
          - "#764ba2"
        direction: 103
        name: 默认渐变2
      - gradient:
          - "#f093fb"
          - "#f5576c"
        direction: 103
        name: 默认渐变3
      - gradient:
          - "#4facfe"
          - "#00f2fe"
        direction: 103
        name: 默认渐变4