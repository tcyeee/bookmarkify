<script>
  /* 必须在任何内容渲染前跑：同步补上 app.vue 里 usePreferredDark() + useHead(bodyAttrs) 要做的事，
     否则下面复用的 Tailwind dark: 类（依赖 body.dark / [data-theme=dark]，见 app.css 的 @custom-variant）
     在挂载前不会生效，会导致深色模式下颜色和挂载后突然跳变。*/
  (function () {
    var isDark = matchMedia('(prefers-color-scheme: dark)').matches
    document.body.classList.toggle('dark', isDark)
    document.body.setAttribute('data-theme', isDark ? 'dark' : 'light')
    if (location.pathname === '/setting') {
      document.getElementById('__nuxt-loader')?.classList.add('is-setting')
    }
  })()
</script>

    inset: 0;
    z-index: 2147483647;
