services:
  bookmarkify-scraper:
    # Image ref (…/scrapper:<git-sha>) is written into .env by the deploy workflow
    image: ${SCRAPPER_IMAGE}
    container_name: bookmarkify-scraper
    restart: unless-stopped
    # Give in-flight requests time to finish under graceful shutdown before Docker
    # SIGKILLs the container. Must exceed HEADLESS_TIMEOUT_SECS (30s below) with margin.
    stop_grace_period: 40s
    # Memory cap — headless Chrome can spike; serialized to one browser at a time.
    # mem_limit is the hard ceiling; memswap_limit allows a little swap headroom so
    # occasional spikes don't OOM-kill Chrome mid-scrape. Tune for the host.
    mem_limit: 1g
    mem_reservation: 256m
    memswap_limit: 2g
    ports:
      # Bound to loopback only — this service has no auth of its own beyond
      # SCRAPER_AUTH_TOKEN (see below) and was never meant to be reachable from
      # the public internet. Host 3000 is owned by bookmarkify-web, hence 3001.
      - "127.0.0.1:3001:3000"
    environment:
      TZ: Asia/Shanghai
      # Container listens on 3000 (host port is controlled by the mapping above)
      PORT: 3000
      REQUEST_TIMEOUT_SECS: 10
      HEADLESS_TIMEOUT_SECS: 30
      CACHE_TTL_SECS: 3600
      RUST_LOG: info
      # Outbound proxy via the `clash` container (containerized Mihomo) on app_network.
      # Both Layer 1 (reqwest) and Layer 2 (headless Chrome) honor this; domestic sites
      # go direct via Clash's GEOIP,CN,DIRECT rule. The clash container is managed on the
      # host by /opt/clash/docker-compose.yml (not by this CI deploy).
      PROXY_URL: http://clash:7890
      # Shared-secret auth for /scrape and /ping — value comes from the SCRAPER_AUTH_TOKEN
      # GitHub secret via .env. Leave unset only during initial rollout; bookmarkify-api
      # must send the same token as `Authorization: Bearer <token>` once this is set.
      SCRAPER_AUTH_TOKEN: ${SCRAPER_AUTH_TOKEN}
      # Aliyun OSS upload — all five must be set to enable; values come from .env
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_KEY_PREFIX: ${OSS_KEY_PREFIX:-}
    networks:
      - app_network

networks:
  # Shared with the other Bookmarkify services so the API can reach this
  # container as http://bookmarkify-scraper:3000. Reused if it already exists,
  # created (bridge) otherwise.
  app_network:
    name: app_network
