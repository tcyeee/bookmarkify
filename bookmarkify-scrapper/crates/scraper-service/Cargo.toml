[package]
name = "scraper-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP 框架
axum = "0.7"
# 异步运行时
tokio = { version = "1", features = ["full"] }
# Layer 1：HTTP 抓取客户端。
# cookies：反爬预热要靠 cookie jar 把根路径下发的 cookie 带到目标页（见 scraper::warm_up_origin）；
# gzip/brotli/deflate：让 reqwest 自动带 Accept-Encoding 并解压——一个不声明压缩支持的
# "Chrome" 是显眼的爬虫特征，顺带也省带宽
reqwest = { version = "0.12", features = ["json", "stream", "cookies", "gzip", "brotli", "deflate"] }
# HTML 解析（CSS 选择器）
scraper = "0.19"
# 序列化 / 反序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 请求追踪中间件
tower-http = { version = "0.5", features = ["trace"] }
# 并发上限 + 过载快速失败（保护 /scrape、/ping 不被无限并发拖垮）
tower = { version = "0.4", features = ["limit", "load-shed", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Layer 2：无头 Chrome（含反指纹 stealth 模式）
spider = { version = "2", features = ["chrome", "chrome_stealth", "chrome_intercept"] }
# 全局单例（HEADLESS_LOCK 等）
once_cell = "1"
# 内存 LRU 缓存
moka = { version = "0.12", features = ["future"] }
# 生成 OSS 对象键（SHA-256）
sha2 = "0.10"
hex = "0.4"
# 阿里云 OSS 请求签名（HMAC-SHA1，见 oss.rs）；上传本身直接用上面的 reqwest 发出，
# 不再依赖已停止维护的 oss-rust-sdk（它会额外拖入一整套独立版本的 reqwest/base64）
hmac = "0.12"
sha1 = "0.10"
httpdate = "1"
# screenshot 转 base64
base64 = "0.22"
# 流式读取响应体（用于大小限制）
futures-util = "0.3"
# 鉴权 token 常量时间比较，防止时序攻击
subtle = "2"
# /metrics：请求量/延迟/状态码分布，Prometheus text 格式
axum-prometheus = "0.7"
