# ============================================================================
# OSS 缓存代理 —— http{} 上下文部分
# ============================================================================
#
# 这个文件只放缓存区声明（必须在 server{} 之外）。真正的 `location ^~ /oss/`
# 在 bookmakify.cc.conf 的 443 server 块里。
#
# ---------------------------------------------------------------------------
# 解决的问题
# ---------------------------------------------------------------------------
#
# 私有桶的图片要给浏览器看就得签名，而签名 URL 会变 —— 哪怕 OssUtils.signWithResize 已经把
# 过期时间向下对齐到窗口边界，URL 仍然每半个窗口换一次。URL 一变浏览器缓存就失效，于是
# **每个用户每次打开桌面**都要为屏幕上每张图重付一次 OSS GET 请求费 + 一次图片处理费。
# 成本随「用户数 × 打开次数 × 书签数 × 尺寸档数」线性增长，四项里没有一项跟收入挂钩：
# 单用户实测每天能烧掉五毛，而单用户日均收入远到不了这个数。
#
#     改前： 唯一资产数 × 尺寸档数 × 用户数 × 每天打开次数     ← 每天重付
#     改后： 唯一资产数 × 尺寸档数                              ← 一次，永久
#
# ---------------------------------------------------------------------------
# 为什么回源打 API 而不是直接打 OSS
# ---------------------------------------------------------------------------
#
# 直连 OSS 需要给桶加一条按来源 IP 放行的 Bucket Policy。实测走不通：阿里云控制台在配 IP
# 条件时要求同时配 VPC 条件，而本机在腾讯云、走公网访问 OSS，永远不在那个 VPC 里 ——
# 同一条 Statement 里的多个条件是 AND，于是策略恒不成立：
#
#     $ curl https://cy-program.oss-cn-hangzhou.aliyuncs.com/scrapper/asset/2681...
#     403  AccessDenied: You have no right to access this object because of bucket acl.
#
# 改成回源到 API 的 /internal/asset/**：SDK 手里就有 AK，私有桶本来就读得动，
# **桶的权限一个字都不用改**。代价是 miss 时多一跳，而 miss 对每个 (key,尺寸) 一辈子
# 只发生一次，所以这一跳不在热路径上。
#
# ---------------------------------------------------------------------------
# 缓存目录为什么在 /var/file 下
# ---------------------------------------------------------------------------
#
# nginx 容器当前挂了四个卷，没有一个指向 /var/cache。要放到标准位置就得改 compose.yml
# 加卷并重建容器 —— 而这台 nginx 同时服务着 bookmarkify、admin、tcyeee.top、stats、tools、
# vialite 等站点，为一个缓存目录让全部站点中断几秒不划算。
#
# /var/file 已经是 rw 挂载（宿主机 /home/ubuntu/bookmarkify/file），且没有任何 vhost 以它
# 为 root（file.bookmarkify.cc 那个 vhost 从未部署过，该域名已废弃），所以放在这里既持久
# 又不会被 HTTP 暴露。**代价是看 compose.yml 看不出这里有个缓存** —— 下次有机会重建容器时，
# 应该换成 `/home/ubuntu/docker/nginx/cache:/var/cache/nginx`（该目录已建好，属主 101:101）。
#
# inactive=180d：180 天没人访问才淘汰。这些是内容寻址对象，留着就是净赚。
# max_size 写满后按 LRU 淘汰，不会出错，只是重新回源一次。
proxy_cache_path /var/file/.oss-cache
                 levels=1:2
                 keys_zone=oss_cache:64m
                 max_size=10g
                 inactive=180d
                 use_temp_path=off;

# ---------------------------------------------------------------------------
# 只有真的是图片才准进缓存
# ---------------------------------------------------------------------------
#
# **本项目的 API 用 HTTP 200 承载业务错误**（`{"ok":false,"code":101,"msg":"请先登录!"}`），
# 所以「状态码 200 就缓存一年」这条规则本身有毒 —— 上线当天就踩到了：端点还没部署时
# 一次 curl 让 nginx 把那份登录错误 JSON 缓存了 365 天，`X-Cache-Status: HIT`，
# 而它长得跟成功响应一模一样，没有任何状态码能把它区分出来。
#
# 判据只能落在 Content-Type 上：这条路径的成功响应必然是 image/*，任何别的东西都是出错了。
# 值为 1 时 `proxy_no_cache` 生效 —— 该响应照常返回给访客，但不写入缓存，下次重新回源。
map $upstream_http_content_type $oss_not_an_image {
    default    1;
    ~*^image/  0;
}
