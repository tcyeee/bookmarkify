log_format bkmon '$time_iso8601 status=$status host=$host "$request" us=$upstream_status';


server {
    listen 80;
    server_name bookmarkify.cc www.bookmarkify.cc;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  bookmarkify.cc www.bookmarkify.cc;
    access_log /var/log/nginx/access.log bkmon;
    ssl_certificate /etc/nginx/cert/bookmarkify.cc.fullchain.cer;
    ssl_certificate_key /etc/nginx/cert/bookmarkify.cc.key;

    location /api/ {

    	# 正常的请求代理
    	#proxy_pass http://123.206.216.124:7001;
    	proxy_pass http://bookmarkify-api:7001/;
    	proxy_set_header Host $host;
    	proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
    	#proxy_pass http://123.206.216.124:7001;    
    	proxy_pass http://bookmarkify-api:7001;    
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 首方 GoatCounter 埋点：同源代理到 goatcounter 容器（Host 路由到 bookmarkify.cc 站点）
    location = /count {
        proxy_pass http://goatcounter:8080;
        proxy_set_header Host              bookmarkify.stats.viii.me;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /count.js {
        proxy_pass http://goatcounter:8080;
        proxy_set_header Host              bookmarkify.stats.viii.me;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- OSS 缓存代理 ---------------------------------------------------
    # 把「每个用户每次开桌面都要重付一次的 OSS GET + 图片处理」收敛成「每个对象一辈子一次」。
    # 缓存区声明在 conf.d/oss-cache-proxy.conf（http 上下文），那里也写了完整来龙去脉。
    #
    # 回源打的是 API 而不是 OSS：直连 OSS 需要 Bucket Policy 按来源 IP 放行，而阿里云要求
    # IP 条件必须与 VPC 条件同时配置，本机在腾讯云、永远不在那个 VPC 里，实测恒 403。
    # API 侧的 SDK 手里就有 AK，私有桶本来就读得动，于是桶权限一个字都不用改。
    location ^~ /oss/ {
        # 前缀式 proxy_pass（末尾带斜杠）：/oss/<key> → /internal/asset/<key>。
        # 不含变量，因而不需要 resolver —— upstream 在启动时解析一次
        proxy_pass http://bookmarkify-api:7001/internal/asset/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Internal-Token "REPLACE_FLAG_OSS_PROXY_TOKEN";
        # 访客的 cookie/凭证与这次回源毫无关系，带上去只会污染缓存判定
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        proxy_cache oss_cache;
        # 本项目 API 用 HTTP 200 承载业务错误，状态码区分不出成败 —— 判据只能是 Content-Type。
        # 非 image/* 的响应照常返回给访客，但**不写入缓存**，避免一份错误 JSON 被钉死一年
        proxy_no_cache $oss_not_an_image;
        # 缓存键只取路径 + 两个尺寸参数。**不能用 $args**：多一个 utm_ 之类的无关参数就会
        # 被当成另一个对象重新回源，而那正是要消灭的开销
        proxy_cache_key "$uri|$arg_w|$arg_h";
        proxy_cache_valid 200 365d;
        # 错误只缓存 1 分钟：既避免一个坏 key 反复打到后端，又不至于把一次配置失误钉死一年
        proxy_cache_valid 403 404 500 502 503 504 1m;
        # 冷启动时同一个 key 只放一个请求回源，其余等它。没有这条，一次全站首屏会对同一张图
        # 并发回源几十次，等于把省下来的开销又交回去
        proxy_cache_lock on;
        proxy_cache_lock_timeout 15s;
        # 后端抽风时继续吐旧副本，别把故障传导到用户界面
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # 让上面的 proxy_cache_valid 说了算。上游对 200 发的是 max-age=1y（会原样透传给浏览器），
        # 但错误码得按我们自己的短策略缓存，不能跟着上游走
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Set-Cookie;

        # 排查命中率就靠它：curl -I 看 HIT/MISS/EXPIRED
        add_header X-Cache-Status $upstream_cache_status always;
        access_log /var/log/nginx/oss-proxy.log;
    }

    # /internal/ 是机器对机器的回源入口，不该从公网够到。
    # 上面的 location /api/ 会把 /api/ 下的一切转发给 API，这条更长的前缀把它挡在外面。
    # API 侧还有共享密钥兜底 —— 这是第二道，不是唯一一道。
    location ^~ /api/internal/ {
        return 404;
    }

    # --- 静态站点的缓存分层 ------------------------------------------------
    # 前端「发版后自动升级」整条链路的地基。原先这里一个缓存头都没有，浏览器对 HTML
    # 走启发式缓存（按 Last-Modified 推算一个自己的过期时间），于是用户即便硬刷新也
    # 可能拿到旧的 index.html —— 而它引用的 chunk 已经在下一次部署里被换掉了。
    # 两条 location 的优先级是 nginx 定死的：精确匹配(=) > 前缀(^~) > 通用前缀(/)。

    # 版本探针：plugins/version.client.ts 与 Nuxt 内置插件都靠比对它里面的 buildId 来
    # 判断「线上是不是已经换版了」。它是唯一一个必须次次回源的文件，被缓存住则整套机制失效。
    # 客户端已经在 URL 上带了时间戳，这条是第二道 —— 中间还可能有代理与浏览器两层。
    location = /_nuxt/builds/latest.json {
        root /var/www/bookmarkify-web;
        add_header Cache-Control "no-store" always;
    }

    # 构建产物的文件名里带内容 hash，内容一变文件名就变，因此同名文件永远不会有新内容，
    # 可以放心 immutable 一年（immutable 的意义是连「回来问一次」都省掉）。
    # builds/meta/<buildId>.json 也在此列 —— 文件名本身就是版本号。
    # max-age 与 immutable 必须写在同一个 add_header 里。用 `expires 1y` 再叠一条
    # add_header 会发出**两个** Cache-Control 响应头，取哪个由客户端自己决定。
    location ^~ /_nuxt/ {
        root /var/www/bookmarkify-web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 剩下的就是 HTML 入口和 public/ 里那几个小文件，一律要求每次回来校验一次
    # （no-cache 不是「不缓存」，是「用之前先问」，未变时走 304，成本只有一个来回的头）。
    #
    # 这条 add_header 必须挂在 location / 上，不能靠一个 `~* \.html$` 正则 location 去接：
    # try_files 只有**最后一个**参数才触发内部重定向、重新匹配 location，前面的参数是
    # 「在当前 context 内直接处理」。于是首页命中的是 `$uri/index.html` 这个非末位参数，
    # 永远走不到正则那条，实测 `curl -I https://bookmarkify.cc/` 一个缓存头都没有。
    location / {
		root /var/www/bookmarkify-web;
		index index.html;
		try_files $uri/index.html $uri /200.html;
		add_header Cache-Control "no-cache" always;
	}
}

