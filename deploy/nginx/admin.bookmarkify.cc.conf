# Admin panel (bookmarkify-admin, Vben/web-ele) — static SPA on a dedicated
# subdomain. Built by .github/workflows/deploy-admin.yml and rsynced to
# /home/ubuntu/www/bookmarkify-admin (= /var/www in the nginx container).
#
# This mirrors the LIVE config deployed to the server at
# /home/ubuntu/docker/nginx/conf.d/admin.bookmarkify.cc.conf. Reload after edits:
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
# Cert: ZeroSSL via acme.sh dns_ali (/root/.acme.sh), installed to
# /home/ubuntu/docker/nginx/cert (= /etc/nginx/cert), auto-renew reloads nginx.

server {
    listen 80;
    server_name admin.bookmarkify.cc;
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  admin.bookmarkify.cc;
    ssl_certificate     /etc/nginx/cert/admin.bookmarkify.cc.fullchain.cer;
    ssl_certificate_key /etc/nginx/cert/admin.bookmarkify.cc.key;

    # API proxy. Admin is built with VITE_GLOB_API_URL=/api, so calls hit
    # /api/admin/** here; the trailing slash on proxy_pass strips the /api prefix
    # -> bookmarkify-api:7001/admin/** (use container name on the nginx bridge net).
    location /api/ {
        if ($request_method = "OPTIONS") {
            add_header "Content-Length" 0;
            return 204;
        }
        proxy_pass http://bookmarkify-api:7001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://bookmarkify-api:7001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static SPA (hash router) -> single index.html fallback covers all routes.
    location / {
        root /var/www/bookmarkify-admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
