name: Deploy Web

on:
  push:
    branches: [prod]
    paths:
      - 'bookmarkify-web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Never run two web deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bookmarkify-web/pnpm-lock.yaml

      - name: Install deps
        working-directory: bookmarkify-web
        run: pnpm install --frozen-lockfile

      # Type check before building. `nuxt generate` does NOT type check — vite
      # strips types without reading them — so a broken type lands in prod
      # silently. Deliberately placed before the build and left blocking: the
      # suite is clean (0 errors), so any failure here is something introduced
      # by the commit being deployed.
      - name: Type check
        working-directory: bookmarkify-web
        run: pnpm typecheck

      # Static site generation (nuxt generate → .output/public). The public
      # runtimeConfig is baked in at build time, so the prod URLs are set here.
      - name: Generate static site
        working-directory: bookmarkify-web
        env:
          # 后端 origin，不带 /api —— nuxt.config.ts 会据此派生 apiBase(+/api) 和 wsBase(wss://)
          NUXT_BACKEND: https://bookmarkify.cc
          NUXT_PUBLIC_SITE_URL: https://bookmarkify.cc
          # Google 登录 ClientId（公开值，前端 JS 里本就可见，直接内联；如需更换可改此处或覆盖为 secret）
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_GOOGLE_CLIENT_ID || '534119394768-5ed59pcgub9a1s45a9uvu69alvk1ddko.apps.googleusercontent.com' }}
          # GitHub 登录 ClientId（公开值，前端 JS 里本就可见，直接内联；如需更换可改此处或覆盖为 secret）
          NUXT_PUBLIC_GITHUB_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_GITHUB_CLIENT_ID || 'Iv23liXTNklcSgqAa8rU' }}
        run: pnpm generate

      # rsync the static output to the dir nginx serves (/home/ubuntu/www →
      # /var/www in the nginx container).
      #
      # Two passes, and the order matters in both directions:
      #
      #  1. `_nuxt/` first, WITHOUT --delete. These are content-hashed chunks, so
      #     adding never conflicts. Keeping the previous build's chunks alive is
      #     what stops an already-open tab from breaking mid-upgrade: it lazy-loads
      #     a route chunk that no longer exists, `try_files` hands it /200.html,
      #     and the dynamic import dies on the MIME type. Pushing assets before
      #     HTML also closes the reverse window, where fresh HTML references a
      #     chunk that hasn't landed yet.
      #  2. everything else WITH --delete, so removed pages/assets really go away.
      #     `--exclude='/_nuxt/'` is anchored to the transfer root on purpose.
      #
      # Stale chunks are swept after 14 days — comfortably longer than any tab
      # stays open, and long enough that a rollback still finds its assets.
      - name: Deploy to server (rsync)
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH_OPTS="ssh -i ~/.ssh/id_deploy -p $SERVER_PORT -o StrictHostKeyChecking=accept-new"

          # 1) hashed build assets — add only, never delete
          rsync -az -e "$SSH_OPTS" \
            bookmarkify-web/.output/public/_nuxt/ \
            "$SERVER_USER@$SERVER_HOST:/home/ubuntu/www/bookmarkify-web/_nuxt/"

          # 2) everything else — keep the dir in sync
          rsync -az --delete --exclude='/_nuxt/' -e "$SSH_OPTS" \
            bookmarkify-web/.output/public/ \
            "$SERVER_USER@$SERVER_HOST:/home/ubuntu/www/bookmarkify-web/"

          # 3) sweep chunks older than 14 days. rsync -a rewrites the mtime of every
          #    file it ships, including ones whose content didn't change, so a chunk
          #    still referenced by the current build never ages out.
          ssh -i ~/.ssh/id_deploy -p "$SERVER_PORT" -o StrictHostKeyChecking=accept-new \
            "$SERVER_USER@$SERVER_HOST" \
            'find /home/ubuntu/www/bookmarkify-web/_nuxt -type f -mtime +14 -delete;
             find /home/ubuntu/www/bookmarkify-web/_nuxt -mindepth 1 -type d -empty -delete' || true

      # Push a WeChat notification via Server酱 once the deploy succeeds.
      # Set the SERVERCHAN_SENDKEY repo secret to enable; without it this is a no-op.
      - name: Notify success (Server酱)
        if: success()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then
            echo "SERVERCHAN_SENDKEY not set — skipping notification."
            exit 0
          fi
          DESP=$(printf '**Commit**: `%s`\n\n**Message**: %s\n\n[查看运行记录](%s)' \
            "${GITHUB_SHA:0:7}" "$COMMIT_MSG" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=✅ bookmarkify-web 部署成功" \
            --data-urlencode "desp=$DESP" >/dev/null
          echo "Notification sent."

      - name: Notify failure (Server酱)
        if: failure()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then exit 0; fi
          DESP=$(printf '**Commit**: `%s`\n\n[查看失败日志](%s)' "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=❌ bookmarkify-web 部署失败" \
            --data-urlencode "desp=$DESP" >/dev/null || true
