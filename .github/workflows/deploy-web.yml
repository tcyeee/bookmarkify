name: Deploy Web

on:
  push:
    branches: [prod]
    paths:
      - 'bookmarkify-web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Never run two web deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: bookmarkify-web/pnpm-lock.yaml

      - name: Install deps
        working-directory: bookmarkify-web
        run: pnpm install --frozen-lockfile

      # Static site generation (nuxt generate → .output/public). The public
      # runtimeConfig is baked in at build time, so the prod URLs are set here.
      - name: Generate static site
        working-directory: bookmarkify-web
        env:
          NUXT_API_BASE: https://bookmarkify.cc/api
          NUXT_WS_BASE: wss://bookmarkify.cc
          NUXT_PUBLIC_SITE_URL: https://bookmarkify.cc
          # Google 登录 ClientId（公开值，前端 JS 里本就可见，直接内联；如需更换可改此处或覆盖为 secret）
          NUXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_GOOGLE_CLIENT_ID || '534119394768-5ed59pcgub9a1s45a9uvu69alvk1ddko.apps.googleusercontent.com' }}
        run: pnpm generate

      # rsync the static output to the dir nginx serves (/home/ubuntu/www →
      # /var/www in the nginx container). --delete keeps the dir in sync.
      - name: Deploy to server (rsync)
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_SSH_PORT || 22 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SERVER_PORT -o StrictHostKeyChecking=accept-new" \
            bookmarkify-web/.output/public/ \
            "$SERVER_USER@$SERVER_HOST:/home/ubuntu/www/bookmarkify-web/"

      # Push a WeChat notification via Server酱 once the deploy succeeds.
      # Set the SERVERCHAN_SENDKEY repo secret to enable; without it this is a no-op.
      - name: Notify success (Server酱)
        if: success()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then
            echo "SERVERCHAN_SENDKEY not set — skipping notification."
            exit 0
          fi
          DESP=$(printf '**Commit**: `%s`\n\n**Message**: %s\n\n[查看运行记录](%s)' \
            "${GITHUB_SHA:0:7}" "$COMMIT_MSG" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=✅ bookmarkify-web 部署成功" \
            --data-urlencode "desp=$DESP" >/dev/null
          echo "Notification sent."

      - name: Notify failure (Server酱)
        if: failure()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then exit 0; fi
          DESP=$(printf '**Commit**: `%s`\n\n[查看失败日志](%s)' "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=❌ bookmarkify-web 部署失败" \
            --data-urlencode "desp=$DESP" >/dev/null || true
