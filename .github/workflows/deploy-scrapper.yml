name: Deploy Scrapper

on:
  push:
    branches: [prod]
    paths:
      - 'bookmarkify-scrapper/**'
      - '.github/workflows/deploy-scrapper.yml'
  workflow_dispatch:

# Never run two scrapper deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-scrapper
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute image refs
        id: meta
        run: |
          BASE="${{ secrets.TCR_REGISTRY }}/${{ secrets.TCR_NAMESPACE }}/scrapper"
          echo "IMAGE_BASE=${BASE}" >> "$GITHUB_ENV"
          echo "image=${BASE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: bookmarkify-scrapper
          file: bookmarkify-scrapper/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Encode compose file
        id: prep
        run: |
          echo "compose_b64=$(base64 -w0 bookmarkify-scrapper/deploy/compose.prod.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: COMPOSE_B64,SCRAPPER_IMAGE,TCR_REGISTRY,TCR_USERNAME,TCR_PASSWORD,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET,OSS_BUCKET,OSS_ENDPOINT,OSS_BASE_URL
          script: |
            set -euo pipefail

            APP_DIR="$HOME/bookmarkify-scrapper"
            mkdir -p "$APP_DIR"

            # Compose file (single source of truth from the repo)
            echo "$COMPOSE_B64" | base64 -d > "$APP_DIR/compose.yml"

            # Runtime env consumed by compose interpolation
            umask 077
            cat > "$APP_DIR/.env" <<EOF
            SCRAPPER_IMAGE=$SCRAPPER_IMAGE
            OSS_ACCESS_KEY_ID=$OSS_ACCESS_KEY_ID
            OSS_ACCESS_KEY_SECRET=$OSS_ACCESS_KEY_SECRET
            OSS_BUCKET=$OSS_BUCKET
            OSS_ENDPOINT=$OSS_ENDPOINT
            OSS_BASE_URL=$OSS_BASE_URL
            EOF

            echo "$TCR_PASSWORD" | docker login "$TCR_REGISTRY" -u "$TCR_USERNAME" --password-stdin

            cd "$APP_DIR"
            docker compose pull
            docker compose up -d

            # Health check: poll /health on the localhost-bound port
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3001/health >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done

            docker image prune -f || true

            if [ "$ok" != "1" ]; then
              echo "::error::Health check failed for $SCRAPPER_IMAGE"
              docker compose logs --tail=80 || true
              exit 1
            fi
            echo "Deploy OK: $SCRAPPER_IMAGE"
        env:
          COMPOSE_B64: ${{ steps.prep.outputs.compose_b64 }}
          SCRAPPER_IMAGE: ${{ needs.build-and-push.outputs.image }}
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BASE_URL: ${{ secrets.OSS_BASE_URL }}
