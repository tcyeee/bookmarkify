name: Deploy API

on:
  push:
    branches: [prod]
    paths:
      - 'bookmarkify-api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Never run two API deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compile the fat jar here on the RAM-rich runner (~35s). The memory-hungry
      # Kotlin/Gradle build stays off the small prod server.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build fat jar
        working-directory: bookmarkify-api
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bootJar

      # Relay the jar through Aliyun OSS instead of a direct cross-border push/scp:
      # runner → OSS upload, then the server pulls it intra-China (fast). Avoids the
      # ~42 min cross-border `docker push` to Tencent TCR and the equally slow direct scp.
      - name: Upload jar to OSS
        id: oss
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          # Match the bucket region used by the app (see compose.prod.yml). To speed up
          # the runner→OSS leg further, enable Transfer Acceleration on the bucket and
          # switch this to oss-accelerate.aliyuncs.com.
          OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com
          # ossutil v2 signs with v4 by default, which requires an explicit region.
          OSS_REGION: cn-hangzhou
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.1/ossutil-2.1.1-linux-amd64.zip
          unzip -q ossutil.zip
          OSSUTIL="$PWD/ossutil-2.1.1-linux-amd64/ossutil"
          chmod +x "$OSSUTIL"

          KEY="deploy/bookmarkify-api-${GIT_SHA}.jar"

          # OSS is only a transfer relay — clear jars left by previous deploys so the
          # bucket keeps just this run's artifact. (Concurrency guard prevents overlap.)
          "$OSSUTIL" rm "oss://${OSS_BUCKET}/deploy/" -r -f \
            -e "$OSS_ENDPOINT" --region "$OSS_REGION" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" || true

          "$OSSUTIL" cp bookmarkify-api/build/libs/bookmarkify-api.jar "oss://${OSS_BUCKET}/${KEY}" \
            -f -e "$OSS_ENDPOINT" --region "$OSS_REGION" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"

          # Pre-signed GET URL (1h) so the server fetches without needing OSS creds.
          URL=$("$OSSUTIL" presign "oss://${OSS_BUCKET}/${KEY}" --expires-duration 1h \
            -e "$OSS_ENDPOINT" --region "$OSS_REGION" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" \
            | grep -Eo 'https?://[^[:space:]]+' | head -1)
          test -n "$URL"
          echo "::add-mask::$URL"
          echo "jar_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Encode files
        id: prep
        run: |
          echo "compose_b64=$(base64 -w0 bookmarkify-api/deploy/compose.prod.yml)" >> "$GITHUB_OUTPUT"
          echo "dockerfile_b64=$(base64 -w0 bookmarkify-api/Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: COMPOSE_B64,DOCKERFILE_B64,JAR_URL,API_IMAGE,SPRING_DATASOURCE_PASSWORD,SPRING_DATA_REDIS_PASSWORD,BOOKMARKIFY_WECHAT_WORK_CORPID,BOOKMARKIFY_WECHAT_WORK_CORPSECRET,BOOKMARKIFY_DEEPSEEK_API_KEY,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET,OSS_BUCKET,BOOKMARKIFY_GITHUB_CLIENT_SECRET,BOOKMARKIFY_SCRAPPER_AUTH_TOKEN
          script: |
            set -euo pipefail

            APP_DIR="$HOME/bookmarkify-api"
            STAGE_DIR="$APP_DIR/stage"
            mkdir -p "$STAGE_DIR"

            # Compose file + thin Dockerfile (single source of truth from the repo)
            echo "$COMPOSE_B64" | base64 -d > "$APP_DIR/compose.yml"
            echo "$DOCKERFILE_B64" | base64 -d > "$STAGE_DIR/Dockerfile"

            # Pull the jar from OSS over the intra-China network (fast).
            curl -fsSL "$JAR_URL" -o "$STAGE_DIR/bookmarkify-api.jar"
            test -s "$STAGE_DIR/bookmarkify-api.jar"

            # Runtime env consumed by compose interpolation
            umask 077
            cat > "$APP_DIR/.env" <<EOF
            API_IMAGE=$API_IMAGE
            SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            SPRING_DATA_REDIS_PASSWORD=$SPRING_DATA_REDIS_PASSWORD
            BOOKMARKIFY_WECHAT_WORK_CORPID=$BOOKMARKIFY_WECHAT_WORK_CORPID
            BOOKMARKIFY_WECHAT_WORK_CORPSECRET=$BOOKMARKIFY_WECHAT_WORK_CORPSECRET
            BOOKMARKIFY_DEEPSEEK_API_KEY=$BOOKMARKIFY_DEEPSEEK_API_KEY
            OSS_ACCESS_KEY_ID=$OSS_ACCESS_KEY_ID
            OSS_ACCESS_KEY_SECRET=$OSS_ACCESS_KEY_SECRET
            OSS_BUCKET=$OSS_BUCKET
            BOOKMARKIFY_GITHUB_CLIENT_SECRET=$BOOKMARKIFY_GITHUB_CLIENT_SECRET
            BOOKMARKIFY_SCRAPPER_AUTH_TOKEN=$BOOKMARKIFY_SCRAPPER_AUTH_TOKEN
            EOF

            # Assemble the runtime image locally: just COPY the jar onto the JRE base
            # (already present on the host). Seconds, tens of MB RAM — no compilation.
            docker build -t "$API_IMAGE" -f "$STAGE_DIR/Dockerfile" "$STAGE_DIR"

            cd "$APP_DIR"
            docker compose up -d

            # Health check: poll the API on its host-mapped port (auth/track is a GET that returns 200).
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:7001/auth/track >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done

            # Reclaim disk: drop dangling layers and older bookmarkify-api image tags.
            docker image prune -f || true
            docker images 'bookmarkify-api' --format '{{.Repository}}:{{.Tag}}' \
              | grep -vF "$API_IMAGE" | xargs -r docker rmi -f 2>/dev/null || true

            if [ "$ok" != "1" ]; then
              echo "::error::Health check failed for $API_IMAGE"
              docker compose logs --tail=120 || true
              exit 1
            fi
            echo "Deploy OK: $API_IMAGE"
        env:
          COMPOSE_B64: ${{ steps.prep.outputs.compose_b64 }}
          DOCKERFILE_B64: ${{ steps.prep.outputs.dockerfile_b64 }}
          JAR_URL: ${{ steps.oss.outputs.jar_url }}
          API_IMAGE: bookmarkify-api:${{ github.sha }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
          BOOKMARKIFY_WECHAT_WORK_CORPID: ${{ secrets.BOOKMARKIFY_WECHAT_WORK_CORPID }}
          BOOKMARKIFY_WECHAT_WORK_CORPSECRET: ${{ secrets.BOOKMARKIFY_WECHAT_WORK_CORPSECRET }}
          BOOKMARKIFY_DEEPSEEK_API_KEY: ${{ secrets.BOOKMARKIFY_DEEPSEEK_API_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          BOOKMARKIFY_GITHUB_CLIENT_SECRET: ${{ secrets.BOOKMARKIFY_GITHUB_CLIENT_SECRET }}
          # Shared secret sent as `Authorization: Bearer <token>` to bookmarkify-scrapper's
          # /scrape and /ping. Must match the scrapper container's SCRAPER_AUTH_TOKEN
          # (see bookmarkify-scrapper's deploy-scrapper.yml). Empty until that secret is set.
          BOOKMARKIFY_SCRAPPER_AUTH_TOKEN: ${{ secrets.BOOKMARKIFY_SCRAPPER_AUTH_TOKEN }}

      # Push a WeChat notification via Server酱 once the deploy + health check pass.
      # Set the SERVERCHAN_SENDKEY repo secret to enable; without it this step is a no-op.
      - name: Notify success (Server酱)
        if: success()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then
            echo "SERVERCHAN_SENDKEY not set — skipping notification."
            exit 0
          fi
          DESP=$(printf '**Commit**: `%s`\n\n**Message**: %s\n\n[查看运行记录](%s)' \
            "${GITHUB_SHA:0:7}" "$COMMIT_MSG" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=✅ bookmarkify-api 部署成功" \
            --data-urlencode "desp=$DESP" >/dev/null
          echo "Notification sent."

      - name: Notify failure (Server酱)
        if: failure()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then exit 0; fi
          DESP=$(printf '**Commit**: `%s`\n\n[查看失败日志](%s)' "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=❌ bookmarkify-api 部署失败" \
            --data-urlencode "desp=$DESP" >/dev/null || true
