name: Deploy API

on:
  push:
    branches: [prod]
    paths:
      - 'bookmarkify-api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Never run two API deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compile the fat jar here on the RAM-rich runner (~35s). The memory-hungry
      # Kotlin/Gradle build stays off the small prod server, and only the ~60-80MB jar
      # crosses the border — not a full image with the JRE base layer (which the docker
      # push to Tencent TCR did, taking ~42 min cross-border).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build fat jar
        working-directory: bookmarkify-api
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bootJar

      # Flat staging dir so scp lands files directly in the server build context.
      - name: Stage deploy artifacts
        run: |
          mkdir -p stage
          cp bookmarkify-api/build/libs/bookmarkify-api.jar stage/
          cp bookmarkify-api/Dockerfile stage/

      # Ship the jar + thin runtime Dockerfile to the server's build context.
      - name: Copy artifacts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: "stage/*"
          target: "/home/${{ secrets.SERVER_USER }}/bookmarkify-api/stage"
          strip_components: 1
          overwrite: true

      - name: Encode compose file
        id: prep
        run: |
          echo "compose_b64=$(base64 -w0 bookmarkify-api/deploy/compose.prod.yml)" >> "$GITHUB_OUTPUT"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: COMPOSE_B64,API_IMAGE,SPRING_DATASOURCE_PASSWORD,SPRING_DATA_REDIS_PASSWORD,BOOKMARKIFY_WECHAT_WORK_CORPID,BOOKMARKIFY_WECHAT_WORK_CORPSECRET,BOOKMARKIFY_DEEPSEEK_API_KEY,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET,OSS_BUCKET
          script: |
            set -euo pipefail

            APP_DIR="$HOME/bookmarkify-api"
            STAGE_DIR="$APP_DIR/stage"
            mkdir -p "$APP_DIR"

            # Compose file (single source of truth from the repo)
            echo "$COMPOSE_B64" | base64 -d > "$APP_DIR/compose.yml"

            # Runtime env consumed by compose interpolation
            umask 077
            cat > "$APP_DIR/.env" <<EOF
            API_IMAGE=$API_IMAGE
            SPRING_DATASOURCE_PASSWORD=$SPRING_DATASOURCE_PASSWORD
            SPRING_DATA_REDIS_PASSWORD=$SPRING_DATA_REDIS_PASSWORD
            BOOKMARKIFY_WECHAT_WORK_CORPID=$BOOKMARKIFY_WECHAT_WORK_CORPID
            BOOKMARKIFY_WECHAT_WORK_CORPSECRET=$BOOKMARKIFY_WECHAT_WORK_CORPSECRET
            BOOKMARKIFY_DEEPSEEK_API_KEY=$BOOKMARKIFY_DEEPSEEK_API_KEY
            OSS_ACCESS_KEY_ID=$OSS_ACCESS_KEY_ID
            OSS_ACCESS_KEY_SECRET=$OSS_ACCESS_KEY_SECRET
            OSS_BUCKET=$OSS_BUCKET
            EOF

            # Assemble the runtime image locally: just COPY the jar onto the JRE base
            # (already present on the host). Seconds, tens of MB RAM — no compilation.
            test -f "$STAGE_DIR/bookmarkify-api.jar"
            docker build -t "$API_IMAGE" -f "$STAGE_DIR/Dockerfile" "$STAGE_DIR"

            cd "$APP_DIR"
            docker compose up -d

            # Health check: poll the API on its host-mapped port (auth/track is a GET that returns 200).
            ok=0
            for i in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:7001/auth/track >/dev/null 2>&1; then ok=1; break; fi
              sleep 3
            done

            # Reclaim disk: drop dangling layers and older bookmarkify-api image tags.
            docker image prune -f || true
            docker images 'bookmarkify-api' --format '{{.Repository}}:{{.Tag}}' \
              | grep -vF "$API_IMAGE" | xargs -r docker rmi -f 2>/dev/null || true

            if [ "$ok" != "1" ]; then
              echo "::error::Health check failed for $API_IMAGE"
              docker compose logs --tail=120 || true
              exit 1
            fi
            echo "Deploy OK: $API_IMAGE"
        env:
          COMPOSE_B64: ${{ steps.prep.outputs.compose_b64 }}
          API_IMAGE: bookmarkify-api:${{ github.sha }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_DATA_REDIS_PASSWORD: ${{ secrets.SPRING_DATA_REDIS_PASSWORD }}
          BOOKMARKIFY_WECHAT_WORK_CORPID: ${{ secrets.BOOKMARKIFY_WECHAT_WORK_CORPID }}
          BOOKMARKIFY_WECHAT_WORK_CORPSECRET: ${{ secrets.BOOKMARKIFY_WECHAT_WORK_CORPSECRET }}
          BOOKMARKIFY_DEEPSEEK_API_KEY: ${{ secrets.BOOKMARKIFY_DEEPSEEK_API_KEY }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}

      # Push a WeChat notification via Server酱 once the deploy + health check pass.
      # Set the SERVERCHAN_SENDKEY repo secret to enable; without it this step is a no-op.
      - name: Notify success (Server酱)
        if: success()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then
            echo "SERVERCHAN_SENDKEY not set — skipping notification."
            exit 0
          fi
          DESP=$(printf '**Commit**: `%s`\n\n**Message**: %s\n\n[查看运行记录](%s)' \
            "${GITHUB_SHA:0:7}" "$COMMIT_MSG" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=✅ bookmarkify-api 部署成功" \
            --data-urlencode "desp=$DESP" >/dev/null
          echo "Notification sent."

      - name: Notify failure (Server酱)
        if: failure()
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SENDKEY:-}" ]; then exit 0; fi
          DESP=$(printf '**Commit**: `%s`\n\n[查看失败日志](%s)' "${GITHUB_SHA:0:7}" "$RUN_URL")
          curl -fsS "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=❌ bookmarkify-api 部署失败" \
            --data-urlencode "desp=$DESP" >/dev/null || true
